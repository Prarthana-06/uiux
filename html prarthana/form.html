<!DOCTYPE html>
<html>
<head>
   
    <title>Form</title>
</head>
<body>
    <h1 align="center"> My Feedback Form </h1>
    Name: <input type="text" name="name"><br><br>
    Email: <input type="email" name="email"><br><br>
    Password: <input type="password" name="password"><br><br>
    Please check all the emotions that apply to you:<br>
   
    angry <input type="checkbox" name="emotions" value="angry"><br>
    Sad<input type="checkbox" name="emotions" value="sad"><br>
    Happy<input type="checkbox" name="emotions" value="Happy"><br>
    Ambivalent<input type="checkbox" name="emotions" value="Ambivalent"><br>
    How Satisfied are you with our service?<br>
    Very Satisfied<input type="radio" name="satisfaction" value="very satisfied"><br>
    Satisfied<input type="radio" name="satisfaction" value="satisfied"><br>
    Didn't care<input type="radio" name="satisfaction" value=" Didn't care"><br>
    Dissatisfied<input type="radio" name="satisfaction" value="Dissatisfied"><br>
    very Dissatisfied<input type="radio" name="satisfaction" value="very dissatisfied"><br><br>
    Futher Comments:
    <textarea name="comments" rows="4" cols="40"></textarea><br><br>
    Bio photo: <input type="file" name="photo" accept=".png,.jpg"><br><br>
    Location visited:<select name="location">
        <option value="select location">Select location</option>
        <option value="India">India</option>
        <option value="USA">USA</option>
        <option value="UK">UK</option>
        <option value="Australia">Australia</option>
    </select><br><br>
    <input type="submit" value="Submit">
    
</body>
</html>
